name: CI

# Pull requests only. This is a private repo, so Actions minutes are metered;
# running on pushes to main as well meant every merge burned a second run of
# the checks the PR had already passed.
on:
  pull_request:

# The repo default is already read-only, but that's a repo setting an org
# policy can flip. Pinning it here keeps least privilege in the file.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete — don't pay for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's `packageManager` field, so CI
      # and local development can't drift onto different pnpm majors.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails if pnpm-lock.yaml is out of date rather than quietly resolving
      # something new — a lockfile that only works locally is a broken build.
      - run: pnpm install --frozen-lockfile

      # `pnpm check` carries --minimumFailingSeverity hint, so this fails on
      # deprecation hints too, while they are still one-line fixes. Same script
      # as local development runs — CI shouldn't enforce a bar you can't
      # reproduce on your own machine.
      - run: pnpm check

      # Browsers are ~130 MB and change only with the Playwright version, so
      # key the cache on the resolved lockfile entry rather than re-downloading
      # on every run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `channel: chromium` in playwright.config.ts uses the full browser
      # rather than the default headless shell, for fidelity with real Chrome.
      # On a cache hit only the OS-level deps are still needed.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # No separate `pnpm build` step: Playwright's webServer builds before it
      # serves, so a standalone build was compiling the site twice per run.
      - run: pnpm test

      # Only on failure — a green run's report is never opened, and artifacts
      # count against storage.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
